# The same checks main runs (build + tests on the software adapter), wired to
# every branch of this fork so a change can be validated without waiting for a
# pull request.
name: Windows tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      XCL_ADAPTER: warp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      - name: Build the runtime and test title
        run: cargo +1.99.0-x86_64-pc-windows-msvc build --locked --workspace
      - name: Test APIs and software-adapter graphics
        run: cargo +1.99.0-x86_64-pc-windows-msvc test --locked -p xcl --lib --test disasm_e2e --test rpf_e2e -- --test-threads=4 --show-output
      - name: Test title selection
        run: cargo +1.99.0-x86_64-pc-windows-msvc test --locked -p xcl --test e2e launcher_uses_configured_exe_in_an_ambiguous_folder -- --exact
